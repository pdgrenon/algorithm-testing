name: Weekly Survivor Report

on:
  schedule:
    # 13:00 UTC Tuesdays (after Monday Night Football results are final)
    - cron: "0 13 * * 2"
    # 13:00 UTC Fridays (after final injury reports/lines settle before the weekend)
    - cron: "0 13 * * 5"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate report
        run: python generate_report.py --out docs/index.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload report as Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
